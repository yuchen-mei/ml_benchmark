[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero-mlbench"
version = "0.3.2"
description = "One-click ML benchmark for NVIDIA GPUs and AMD GPUs/NPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
llm = ["transformers>=4.51,<5", "accelerate>=1.0", "safetensors>=0.4"]
llm-quant = [
    "transformers>=4.51,<5",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "bitsandbytes>=0.49",
]

[project.scripts]
mlbench = "mlbench.cli:main"

[tool.setuptools.packages.find]
include = ["mlbench*"]
