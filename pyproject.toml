[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero-mlbench"
version = "0.2.0"
description = "One-click ML benchmark for NVIDIA GPUs and AMD GPUs/NPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
mlbench = "mlbench.cli:main"

[tool.setuptools.packages.find]
include = ["mlbench*"]
